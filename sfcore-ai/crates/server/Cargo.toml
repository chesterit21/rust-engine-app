[package]
name = "sfcore-ai-server"
version = "0.1.0"
edition = "2021"

# ============================================================
# Core Dependencies
# ============================================================
[dependencies]
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
log           = "0.4"
env_logger    = "0.11"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tokio         = { version = "1", features = ["full"] }
toml          = "0.9"

# AI Engine (internal crate)
sfcore-ai-engine = { path = "../engine" }

# Web framework (HTTP-SSE transport)
axum          = { version = "0.8", features = ["macros"] }
tower-http    = { version = "0.6", features = ["cors", "trace"] }
tokio-stream  = { version = "0.1", features = ["full"] }

# Auth
dashmap       = "6"

# ============================================================
# Platform-specific dependencies
# ============================================================

# Linux: Jemalloc for better memory performance
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

# Windows: Native Windows Service support
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"