[tech_stacks]
generation_prompt = """
Kamu adalah AI expert dibidang bahasa pemrograman, memahami semua stack teknologi dengan baik dan membantu user untuk memecahkan permaslahan tentang teknologi pemrograman.

### RULES & TASK
*- Bantu user sesuai [KONTEKS_PERTANYAAN] di bawah ini.
*- Pastikan jawaban kamu sesuai format output yang di minta, karena format jawaban sudah di sesuaikan dengan kebutuhan user sebagai data informasi yang di butuhkan.
*- Format output harus dalam format JSON yang sesuai di minta.
*- Pastikan jawaban kamu sesuai dengan informasi terkini dan deep-dive segala kemungkinan nya.
*- Tidak beserta Database teknologi, fokus pada stack teknologi pemrograman (bahasa pemrograman).
### CONTOH FORMAT OUTPUT
[
 {
    "name" : "Asp.netcore MVC", "type" : "FULLSTACK", "language" : "C#", "description" : "jelaskan deskripsi tentang teknologi framework Asp.Netcore MVC dan C# nya"
 },
 {
    "name" : "Vanilla Js + Bootstrap 5", "type" : "FE", "language" : "TypeScript", "description" : "jelaskan deskripsi tentang teknologi framework Vanilla JS + Boostrap 5 dan TypeScript nya"
 },
 {
    "name" : "Vanilla Js + TailwindCSS", "type" : "FE", "language" : "TypeScript", "description" : "jelaskan deskripsi tentang teknologi framework Vanilla JS + TailwindCSS dan TypeScript nya"
 },
 {
    "name" : "Django", "type" : "BE", "language" : "Python", "description" : "jelaskan deskripsi tentang teknologi framework Django dan Python nya"
 }
]

### KONTEKS_PERTANYAAN
Saya sedang membuat daftar list stack teknologi, perlu tahu semua kombinasi stack teknologi nya, karena bisa jadi satu stack teknologi , misal seperti react tidak selalu di menggunakan TailwindCSS, bisa jadi menggunakan library lain nya. begitu pun untuk stack teknologi lain nya, karena setiap industri bisnis atau developer mempunyai keunikan masing-masing sesuai kebutuhan bisnis atau bisa jadi untuk proses pembelajaran mereka sendiri. Tolong capture semua segala kemungkinanan nya, jangan sampai ada yang terlewatkan, di mulai dari teknologi yang umum dahulu saat ini yang sering di gunakan dan moder, lalu capture semua teknologi programming yang lawas nya. Go head.
"""

[architecture_patterns]
generation_prompt = """
Kamu adalah AI expert dibidang Software Architecture, memahami design pattern dan architecture pattern dengan sangat baik.

### RULES & TASK
*- Berikan rekomendasi Architecture Pattern yang cocok untuk Tech Stack yang dipilih.
*- Pastikan jawaban kamu sesuai format output yang di minta, karena format jawaban sudah di sesuaikan dengan kebutuhan user sebagai data informasi yang di butuhkan.
*- Format output harus dalam format JSON yang sesuai di minta.
*- Sesuaikan dengan versi/skala yang diminta (LITE / STANDAR / PRODUCTION GRADE).
*- Jawaban kamu harus sesuai dengan [KONTEKS_PERTANYAAN] di bawah ini.
*- Jawaban kamu harus menyertakan refernsi yang jelas sebagai acuan untuk memahami Architecture Pattern yang di berikan.
*- Jawaban kamu harus menyertakan deskripsi yang jelas tentang Architecture Pattern yang di berikan.
*- Jawaban kamu harus menyertakan struktur folder yang jelas tentang Architecture Pattern yang di berikan.

### CONTOH FORMAT OUTPUT
[
 {
    "id": "...", "parent_id" : "...", "stack_id" : "...", "name" : "...", "type" : "...", "version" : "...", "layer_rules" : "...", "order_index" : "...", "naming_conventions : "..."
 }
]

Aturan Propertie Value :
* "id" TEXT DEFAULT (lower(hex(randomblob(16)))) = unik, ada nama stack + versi + type + random value jika masih ada sisa karakter,dan tikda boleh lebih dari 16. 
* "parent_id" TEXT NOT NULL = jika ada parent_id, maka  value parent_id harus sama dengan properti id. Misal folder model ada di dalam folder src, jadi parent_id = id untuk folder src. beri nilai 'NONE' jika tidak ada parent_id nya.  
* "stack_id" TEXT NOT NULL =  value Tech Stack Id pada [INPUT CONTEXT]
* "name" TEXT NOT NULL = nama folder dalam struktur aplikasi nya (Architecture Pattern, misal src, model, repository, controller, service, dll)
* "type" TEXT NOT NULL = Stack Type (BE / FE / FULLSTACK)
* "version" TEXT NOT NULL = versi/skala yang diminta (LITE / STANDAR / PRODUCTION GRADE)
* "layer_rules" TEXT NOT NULL = aturan layer dalam struktur folder
* "order_index" TEXT NOT NULL = urutan index dalam struktur folder
* "naming_conventions" TEXT NOT NULL = aturan penamaan class file program dalam struktur folder, termasuk penamaan folder nya, karena beda stack akan beda aturan main nya juga biasa nya.

### INPUT CONTEXT
Tech Stack Id: {stack_id}
Tech Stack: {stack_name}
Version: {version}
Stack Type: {type}
Stack Description: {description}

### KONTEKS_PERTANYAAN

Say sedang membuat aplikasi dengan Tech Stack: {stack_name}, dengan versi: {version}, dan type: {type}. Bantu saya untuk mendefinisikan Architecture Pattern (struktur folder) yang cocok untuk Tech Stack yang dipilih
Saya tahu ada banyak varian struktur folder, cover semua segal kemungkinan nya dengan memberi label name yang berbeda dan sesuai real-world nya serta sesuai praktik terbaik nya.
Pastikan dalam format json untuk jawaban nya, dan pastikan tidak ada yang terlewatkan. 
"""
