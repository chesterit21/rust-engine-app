# server_config.toml
# SFCore AI Server Configuration

# === Model Configuration ===
model = "./models/Qwen3-0.6B-UD-Q5_K_XL.gguf"

# === Model Type ===
# Qwen3-0.6B-UD-Q5_K_XL
# Qwen3-1.7B
# QwenCoder
# QwenCoder-1.5b

# === Transport Mode ===
# Options: "uds" | "http-sse" | "tcp"
transport = "http-sse"

# === Authentication ===
[auth]
api_key = "sk-sfcore-1234567890abcdef"
allowed_clients = ["MyApp-v1.0", "Dashboard-v2.0", "MobileApp-v1.5"]

# === Rate Limiting ===
[rate_limit]
requests_per_minute = 60

# === Transport Configurations ===
[uds]
socket = "/tmp/sfcore-ai.sock"

[http]
host = "0.0.0.0"
port = 8080

[tcp]
host = "127.0.0.1"
port = 8765


# Or expose to network (⚠️ WARNING: No encryption!)
# host = "0.0.0.0"
# port = 8765

# === Engine Performance Parameters ===
# Semua parameter ini bisa di-override via CLI arguments

[engine]
# Context & Memory
context_length = 4096        # -c, --ctx-size: Max context length
batch_size = 512              # --batch-size: Logical batch size for prompt processing
ubatch_size = 256             # --ubatch-size: Physical batch size (per step)

# Threading
threads = 4                   # --threads: Decoding threads (50-75% cores)
threads_batch = 4             # --threads-batch: Batch processing threads

# Parallel Processing
parallel = 1                  # --parallel: Number of parallel sequences (multi-request)

# Caching & Memory
no_cache_prompt = false       # --no-cache-prompt: Disable prompt caching (save memory)
mlock = true                  # Lock model in RAM (prevent swap)

# Token Management
keep_tokens = -1              # --keep: Tokens to keep from prompt (-1 = all, 0 = none)

# Sampling Defaults (dapat di-override per request)
# Random seed = 0 (or remove this line to default to 1234)
# Fixed seed = any other number (e.g. 1234)
seed = 0 # -- rubah seed ke 1234 untuk jawaban yang sama, untuk pertanyaan yang sama..
temperature = 0.5
top_k = 40
top_p = 0.9
min_p = 0.05

# Penalties
repeat_penalty = 1.0
repeat_last_n = 64
frequency_penalty = 0.3
presence_penalty = 0.2
